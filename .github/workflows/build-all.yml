name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Matrix build for desktop platforms
  build-desktop:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifacts: 'app/release/*.exe'
            asset_name: windows
          - os: macos-latest
            target: mac
            artifacts: 'app/release/*.dmg,app/release/*.zip'
            asset_name: macos
          - os: ubuntu-latest
            target: linux
            artifacts: 'app/release/*.AppImage,app/release/*.deb'
            asset_name: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev fuse

      - name: Install Python dependencies
        run: |
          cd core
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          cd app
          npm ci

      - name: Build Electron app
        run: |
          cd app
          npm run build

      - name: Build distributable
        run: |
          cd app
          npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.artifacts }}
          retention-days: 30

  # Android build (separate - needs Android SDK)
  build-android:
    name: Android (Debug APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools
            cmdline-tools;latest

      - name: Install Node dependencies (app)
        run: |
          cd app
          npm ci

      - name: Build web bundle
        run: |
          cd app
          npm run build:web

      - name: Install Capacitor CLI
        run: |
          npm install -g @capacitor/cli

      - name: Setup Capacitor mobile (install deps)
        run: |
          cd mobile
          npm ci

      - name: Add Android platform
        run: |
          cd mobile
          npx cap add android

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Fix Gradle wrapper permissions
        run: |
          chmod +x mobile/android/gradlew

      - name: Build Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Create Release (runs after all builds complete)
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    if: always()
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist/windows
        continue-on-error: true

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist/macos
        continue-on-error: true

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist/linux
        continue-on-error: true

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android
          path: dist/android
        continue-on-error: true

      - name: Collect all artifacts
        run: |
          mkdir -p dist/all
          cp -r dist/windows/* dist/all/ 2>/dev/null || true
          cp -r dist/macos/* dist/all/ 2>/dev/null || true
          cp -r dist/linux/* dist/all/ 2>/dev/null || true
          cp -r dist/android/* dist/all/ 2>/dev/null || true
          ls -la dist/all/

      - name: Generate release notes
        run: |
          cat << 'EOF' > release_notes.md
          # AI-TRADER ${{ github.ref_name }}

          ## 📥 Downloads

          ### Windows
          - `AI-TRADER-${{ github.ref_name }}-x64.exe` — NSIS installer
          - `AI-TRADER-${{ github.ref_name }}-x64-portable.exe` — Portable (no install)

          ### macOS
          - `AI-TRADER-${{ github.ref_name }}-x64.dmg` — Intel Macs
          - `AI-TRADER-${{ github.ref_name }}-arm64.dmg` — Apple Silicon (M1/M2/M3)
          - `AI-TRADER-${{ github.ref_name }}-x64-mac.zip` / `arm64-mac.zip` — Zip archives

          ### Linux
          - `AI-TRADER-${{ github.ref_name }}-x86_64.AppImage` — Runs anywhere (AppImage)
          - `AI-TRADER-${{ github.ref_name }}-x86_64.deb` — Debian/Ubuntu/Mint

          ### Android
          - `AI-TRADER-${{ github.ref_name }}-android-debug.apk` — Debug build (connects to remote core)

          > **Note:** Android and iOS apps are **remote-control shells** — they connect to the Python core running on your PC (same Wi-Fi) or a tunnel (Tailscale/ngrok). The core does not run on the phone.

          ## 🖥️ Platform Notes

          | Platform | MT5 Support | Other Brokers | Notes |
          |----------|-------------|---------------|-------|
          | Windows | ✅ Native | ✅ All | Full support |
          | macOS | ❌ Use MetaAPI | ✅ MetaAPI, CCXT, Alpaca, OANDA | MT5 terminal is Windows-only |
          | Linux | ❌ Use MetaAPI | ✅ MetaAPI, CCXT, Alpaca, OANDA | MT5 terminal is Windows-only |
          | Android | Remote only | Remote only | Connects to PC core |
          | iOS | Remote only | Remote only | Needs Apple Developer account ($99/yr) |

          ## 🚀 Quick Start

          1. Download the installer for your OS
          2. Install & launch
          3. **Models** tab → Add Groq/OpenRouter/other API key → Test
          4. **Brokers** tab → Add MT5 (Windows) or MetaAPI/CCXT/Alpaca/OANDA → Test
          5. **Autopilot** tab → Enable → Run Once (demo) → Watch dashboard
          6. Settings → Risk → Configure limits

          ## 🔐 Security

          - API keys encrypted locally (Fernet AES-128 + machine seed)
          - No telemetry, no cloud, no required accounts
          - Paper/demo mode by default — live trading requires explicit opt-in

          ## 📱 Mobile Setup (Android)

          1. Install APK on phone
          2. Ensure phone & PC on same Wi-Fi (or use Tailscale/ngrok tunnel)
          2. App Settings → Core URL → `http://<PC-IP>:8765` or `https://<tunnel>.ts.net`
          4. Use full UI remotely

          ## 📦 What's Included

          - **27 Skills** (16 built-in + 11 from trader-skill): risk, sizing, analyst, screener, alerts, copycat, pelosi, budget, tax, rebalance, broker, news, backtest validator, market analyst, pair screener, portfolio rebalance, prop firm guard, crypto perp guard, technical analysis, trade execution, trade journal, web research, MCP builder, model provider setup, news catalyst, position sizing
          - **7 Broker Adapters**: Paper, MT5 (Windows), MetaAPI, CCXT, Alpaca, OANDA, Webhook
          - **6 Model Providers** (pre-configured): Groq, Cerebras, Google AI Studio, NVIDIA NIM, Ollama, OpenRouter
          - **4 MCP Servers**: Fetch, Firecrawl, Playwright, Context7

          ---
          **Full Changelog:** https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          EOF
          cat release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI-TRADER ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: dist/all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}