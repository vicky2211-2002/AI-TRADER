name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Desktop: Windows, macOS, Linux
  # ---------------------------------------------------------------------------
  build-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: win
            artifact: windows
          - name: macOS
            os: macos-latest
            target: mac
            artifact: macos
          - name: Linux
            os: ubuntu-latest
            target: linux
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm fakeroot

      - name: Install app dependencies
        shell: bash
        run: |
          cd app
          npm ci

      # The tag is the single source of truth for the version. Without this the
      # binaries kept the old package.json version and a v0.1.1 release shipped
      # files literally named "AI-TRADER-0.1.0-x64.exe".
      - name: Stamp version from the release tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Not a tag build; keeping package.json version."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building version ${VERSION}"
          ( cd app && npm version "${VERSION}" --no-git-tag-version --allow-same-version )
          ( cd mobile && npm version "${VERSION}" --no-git-tag-version --allow-same-version )
          sed -i.bak -E "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" core/aitrader/__init__.py
          sed -i.bak -E "s/^APP_VERSION = \".*\"/APP_VERSION = \"${VERSION}\"/" core/aitrader/config.py
          grep -n "__version__" core/aitrader/__init__.py
          grep -n "APP_VERSION" core/aitrader/config.py

      - name: Install core dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r core/requirements.txt pyinstaller
          # MetaTrader5 is Windows-only and ships a native .pyd. Without it in
          # the build environment the frozen core silently loses the MT5 bridge
          # and the Brokers tab says "MetaTrader5 is not importable".
          if [ "${{ runner.os }}" = "Windows" ]; then
            python -m pip install "MetaTrader5>=5.0.45"
            python -c "import MetaTrader5; print('[deps] MetaTrader5 OK')"
          fi

      # Ships a real Python runtime inside the installer so end users never
      # install Python or run pip.
      - name: Build frozen core sidecar
        shell: bash
        run: |
          python core/build_sidecar.py --clean
          # Fail loudly if the bridge did not make it into the bundle.
          if [ "${{ runner.os }}" = "Windows" ]; then
            if ! ls app/core-runtime/_internal/ | grep -qi "MetaTrader5"; then
              echo "::error title=sidecar::MetaTrader5 was not bundled into the frozen core"
              ls app/core-runtime/_internal/ | head -50
              exit 1
            fi
            echo "[sidecar] MetaTrader5 bundled OK"
          fi

      # Bundle Node.js (includes npx) for MCP servers — no system Node.js needed.
      # The npm CLI must travel with node.exe: npx.cmd resolves
      # %~dp0\node_modules\npm\bin\npx-cli.js and that script needs npm\lib\.
      - name: Download bundled Node.js
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/node/node_modules
          NODE_VERSION="v20.18.1"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ARCHIVE="node-${NODE_VERSION}-win-x64"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://nodejs.org/dist/${NODE_VERSION}/${ARCHIVE}.zip" -o /tmp/node.zip
            rm -rf /tmp/node && mkdir -p /tmp/node
            unzip -o -q /tmp/node.zip -d /tmp/node
            cp "/tmp/node/${ARCHIVE}/node.exe" app/node/
            cp "/tmp/node/${ARCHIVE}/npx.cmd" app/node/
            cp -r "/tmp/node/${ARCHIVE}/node_modules/npm" app/node/node_modules/
          else
            if [ "${{ runner.os }}" = "Linux" ]; then
              ARCHIVE="node-${NODE_VERSION}-linux-x64"
            else
              ARCHIVE="node-${NODE_VERSION}-darwin-arm64"
            fi
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://nodejs.org/dist/${NODE_VERSION}/${ARCHIVE}.tar.xz" -o /tmp/node.tar.xz
            rm -rf /tmp/node && mkdir -p /tmp/node
            tar -xf /tmp/node.tar.xz -C /tmp/node
            cp "/tmp/node/${ARCHIVE}/bin/node" app/node/
            cp "/tmp/node/${ARCHIVE}/bin/npx" app/node/
            cp -r "/tmp/node/${ARCHIVE}/lib/node_modules/npm" app/node/node_modules/
            chmod +x app/node/node app/node/npx
          fi
          echo "Node.js bundled:"; ls -la app/node/
          if [ ! -f app/node/node_modules/npm/bin/npx-cli.js ]; then
            echo "::error title=node::npm CLI (npx-cli.js) missing"
            exit 1
          fi
          if [ ! -f app/node/node_modules/npm/lib/cli.js ]; then
            echo "::error title=node::npm lib/cli.js missing — npx would crash"
            exit 1
          fi

      # Bundle uv for MCP servers — no system uv needed.
      # Both uv AND uvx are needed: the MCP catalog invokes "uvx", which is a
      # separate binary from "uv".
      - name: Download bundled uv
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/uv
          if [ "${{ runner.os }}" = "Windows" ]; then
            UV_URL="https://github.com/astral-sh/uv/releases/download/0.4.30/uv-x86_64-pc-windows-msvc.zip"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$UV_URL" -o /tmp/uv.zip
            rm -rf /tmp/uv && mkdir -p /tmp/uv
            unzip -o -q /tmp/uv.zip -d /tmp/uv
            cp /tmp/uv/uv.exe app/uv/
            cp /tmp/uv/uvx.exe app/uv/
          else
            if [ "${{ runner.os }}" = "Linux" ]; then
              UV_ARCHIVE="uv-x86_64-unknown-linux-gnu"
            else
              UV_ARCHIVE="uv-aarch64-apple-darwin"
            fi
            UV_URL="https://github.com/astral-sh/uv/releases/download/0.4.30/${UV_ARCHIVE}.tar.gz"
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "$UV_URL" -o /tmp/uv.tar.gz
            rm -rf /tmp/uv && mkdir -p /tmp/uv
            tar -xzf /tmp/uv.tar.gz -C /tmp/uv
            cp "/tmp/uv/${UV_ARCHIVE}/uv" app/uv/
            cp "/tmp/uv/${UV_ARCHIVE}/uvx" app/uv/
            chmod +x app/uv/uv app/uv/uvx
          fi
          echo "uv bundled:"; ls -la app/uv/
          if [ ! -f app/uv/uvx.exe ] && [ ! -f app/uv/uvx ]; then
            echo "::error title=uv::uvx missing after extraction"
            exit 1
          fi

      # One place that proves the MCP runtimes are actually usable, not just
      # present. A bundle that cannot execute npx/uvx is worse than none.
      # This runs after BOTH downloads, so both folders exist.
      - name: Verify bundled MCP runtimes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/app/node:$PWD/app/uv:$PATH"
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./app/node/node.exe --version
            ./app/node/npx.cmd --version
            ./app/uv/uv.exe --version
            ./app/uv/uvx.exe --version
          else
            ./app/node/node --version
            ./app/node/npx --version
            ./app/uv/uv --version
            ./app/uv/uvx --version
          fi
          echo "::notice title=mcp-runtimes::Bundled Node.js and uv both execute"

      - name: Build UI + Electron main
        shell: bash
        run: |
          cd app
          npm run build

      - name: Package installer
        id: package
        continue-on-error: true
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          cd app
          npx electron-builder --${{ matrix.target }} --publish never 2>&1 | tee ../electron-builder.log

      # Surface the real reason in the run annotations; the raw step log is not
      # visible from the API, and guessing is how the last three runs were wasted.
      - name: Report packaging failure
        if: steps.package.outcome == 'failure'
        shell: bash
        run: |
          echo "electron-builder failed for ${{ matrix.name }}"
          tail -40 electron-builder.log | while IFS= read -r line; do
            line="$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            [ -n "$line" ] && echo "::error title=electron-builder::$line"
          done
          exit 1

      - name: Collect installers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          for f in app/release/*.exe app/release/*.dmg app/release/*.zip \
                   app/release/*.AppImage app/release/*.deb app/release/*.tar.gz; do
            [ -f "$f" ] || continue
            case "$f" in
              *.blockmap) continue ;;
            esac
            cp "$f" out/
          done
          echo "--- produced ---"
          ls -lh out || true
          if [ -z "$(ls -A out 2>/dev/null || true)" ]; then
            echo "::error title=no-artifacts::${{ matrix.name }} produced no installers"
            tail -40 electron-builder.log || true
            exit 1
          fi

      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Android (debug APK, connects to a core running on the user's PC)
  # ---------------------------------------------------------------------------
  build-android:
    name: Android (debug APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Runners already ship an Android SDK; installing the three packages we
      # need through sdkmanager is far more reliable than action inputs.
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build web bundle
        shell: bash
        run: |
          cd app
          npm ci
          npm run build:web

      - name: Prepare Capacitor Android project
        shell: bash
        run: |
          set -euo pipefail
          cd mobile
          npm install --no-audit --no-fund
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Allow LAN cleartext to the core
        shell: bash
        run: |
          # The phone talks to the user's own PC over plain HTTP on the LAN.
          # Android 9+ blocks that by default, which showed up as "Core offline".
          python - <<'PY'
          from pathlib import Path
          manifest = Path("mobile/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          xml = Path("mobile/android/app/src/main/res/xml/network_security_config.xml")
          xml.parent.mkdir(parents=True, exist_ok=True)
          xml.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '  <base-config cleartextTrafficPermitted="true" />\n'
              '</network-security-config>\n',
              encoding="utf-8",
          )
          if "networkSecurityConfig" not in text:
              text = text.replace(
                  "<application",
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1,
              )
          if "usesCleartextTraffic" not in text:
              text = text.replace(
                  "<application",
                  '<application android:usesCleartextTraffic="true"',
                  1,
              )
          manifest.write_text(text, encoding="utf-8")
          print(text[:400])
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/android
          chmod +x gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION="${GITHUB_REF_NAME#v}"
          APK="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "::error::APK not produced"; exit 1; }
          cp "$APK" "out/AI-TRADER-${VERSION}-android-debug.apk"
          ls -lh out

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Release: publish exactly the binaries this run built
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-android]
    if: always() && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
        continue-on-error: true

      - name: Flatten and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          find dist -type f -exec cp {} upload/ \; 2>/dev/null || true
          rm -f upload/*.blockmap upload/*.yml upload/*.yaml 2>/dev/null || true
          echo "--- artifacts ---"
          ls -lh upload || true
          VERSION="${GITHUB_REF_NAME#v}"
          missing=""
          ls upload/*.exe >/dev/null 2>&1 || missing="$missing windows"
          { ls upload/*.dmg >/dev/null 2>&1 || ls upload/*-mac.zip >/dev/null 2>&1 || ls upload/*.zip >/dev/null 2>&1; } || missing="$missing macos"
          ls upload/*.AppImage >/dev/null 2>&1 || missing="$missing linux"
          ls upload/*.apk >/dev/null 2>&1 || missing="$missing android"
          echo "MISSING=${missing# }" >> "$GITHUB_ENV"
          if [ -n "$missing" ]; then
            echo "::warning::Release is missing artifacts for:${missing}"
          fi
          if [ -z "$(ls -A upload 2>/dev/null || true)" ]; then
            echo "::error::No build artifacts were produced; nothing to publish."
            exit 1
          fi
          # Guard against the old bug where a release shipped files with the
          # previous version in the filename.
          if ls upload/* | grep -qv -- "-${VERSION}"; then
            echo "--- warning: some asset names do not contain ${VERSION} ---"
            ls upload
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# AI-TRADER ${GITHUB_REF_NAME}"
            echo
            echo "Autonomous, risk-gated trading cockpit. Paper/demo by default; live trading needs two explicit switches."
            echo
            echo "## Downloads"
            echo
            echo '| Platform | File | What it is |'
            echo '|----------|------|------------|'
            for f in upload/*; do
              n="$(basename "$f")"
              case "$n" in
                *portable.exe) p="Windows"; d="Portable — no install, no admin rights" ;;
                *.exe)        p="Windows"; d="Installer (NSIS). Bundles its own Python core." ;;
                *.dmg)        p="macOS";   d="Disk image (unsigned: right-click → Open)" ;;
                *.zip)        p="macOS";   d="Zip archive" ;;
                *.AppImage)   p="Linux";   d="AppImage — chmod +x and run" ;;
                *.deb)        p="Linux";   d="Debian/Ubuntu package" ;;
                *.apk)        p="Android"; d="Debug APK — remote control for the core on your PC" ;;
                *)            p="Other";   d="Build artifact" ;;
              esac
              echo "| $p | \`$n\` | $d |"
            done
            echo
            if [ -n "${MISSING:-}" ]; then
              echo "> **Not in this release:** ${MISSING}."
              echo "> The build log for that platform is in the Actions run linked below."
              echo
            fi
            echo "## First run"
            echo
            echo "1. Install and launch. The app starts its own local core on port 8765 — no Python, no terminal."
            echo "2. **Models** → add a provider key (Groq, Cerebras, Google AI Studio, OpenRouter, Ollama) → **Test**."
            echo "3. **Brokers** → Paper for a rehearsal, or MT5 on Windows (terminal path is auto-detected) → **Test**."
            echo "4. **Autopilot** → *Run one cycle* to watch the vote, the sizing and the risk gate. Live stays locked."
            echo
            echo "## Notes"
            echo
            echo "- Windows/macOS/Linux desktop apps bundle a frozen Python core (\`resources/core-runtime\`)."
            echo "- The Android APK is a remote control only. Point it at \`http://<your-PC-LAN-IP>:8765\`."
            echo "- MT5 is Windows-only; on macOS/Linux use MetaAPI, CCXT, Alpaca, OANDA or a webhook."
            echo "- No profit is promised. Backtests and demo runs are not evidence of future returns."
            echo
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          } > release_notes.md
          cat release_notes.md

      - name: Delete previous release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AI-TRADER ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: bash
        run: |
          {
            echo "### AI-TRADER ${GITHUB_REF_NAME}"
            echo
            echo "| File | Size |"
            echo "|------|------|"
            for f in upload/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            if [ -n "${MISSING:-}" ]; then
              echo
              echo "Missing platforms: **${MISSING}** — check the failing job above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
